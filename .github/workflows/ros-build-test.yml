name: Build and Test OCS2 (ROS 2 Jazzy + colcon)

on:
  push:
    branches: [ jazzy ]
  pull_request:
    branches: [ jazzy ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    runs-on: ubuntu-latest
    container:
      # Official ROS 2 Jazzy base (Ubuntu 24.04 / Noble)
      image: ros:jazzy-ros-base

    steps:
      - name: Environment Info
        shell: bash
        run: |
          pwd
          uname -r
          . /etc/os-release && echo "$NAME $VERSION"
          lsb_release -a || true
          printenv | sort

      - name: System deps
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential cmake ninja-build pkg-config \
            python3-pip python3-colcon-common-extensions python3-vcstool \
            liburdfdom-dev liboctomap-dev libassimp-dev \
            checkinstall wget rsync

      - uses: actions/checkout@v4
        with:
          path: src/ocs2

      - name: Source ROS 2 and rosdep install
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          # Install dependencies for everything in ./src (ignore things we build from source)
          rosdep install --from-paths src --ignore-src -r -y

      - name: Checkout dependencies (Pinocchio, hpp-fcl, assets)
        shell: bash
        run: |
          git clone https://github.com/leggedrobotics/ocs2_robotic_assets.git src/ocs2_robotic_assets
        # git clone --recurse-submodules https://github.com/leggedrobotics/pinocchio.git src/pinocchio
        # git clone --recurse-submodules https://github.com/leggedrobotics/hpp-fcl.git src/hpp-fcl

      - name: Build (${{ matrix.build_type }})
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # Enable tests and use symlink install for faster iteration
          colcon build \
            --event-handlers console_cohesion+ \
            --symlink-install \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DBUILD_TESTING=ON

      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --all --verbose
