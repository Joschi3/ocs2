name: Lint, Build & Test
on:
  push:
    branches:
      - jazzy
      - lyrical
  pull_request:
defaults:
  run:
    shell: bash

jobs:
  Linting:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install and Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [jazzy, lyrical]
    name: Build & Test (${{ matrix.rosdistro }})
    # The job runs inside the ROS container, the host OS does not matter
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.rosdistro }}-ros-base
    env:
      # Hosted runners have 4 cores / 16 GB RAM. OCS2 translation units need up to ~2 GB each,
      # so limit colcon workers and compile jobs per package to avoid OOM kills.
      COLCON_WORKERS: 2
      MAKEFLAGS: -j2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y ros-dev-tools git

      - uses: actions/checkout@v4
        with:
          path: src/ocs2

      - name: Checkout ocs2_robotic_assets
        run: git clone --depth 1 https://github.com/Joschi3/ocs2_robotic_assets.git src/ocs2_robotic_assets

      - name: rosdep
        run: |
          rosdep update --rosdistro ${{ matrix.rosdistro }}
          rosdep install -y --from-paths src --ignore-src --rosdistro ${{ matrix.rosdistro }}

      - name: Build
        run: |
          source /opt/ros/${{ matrix.rosdistro }}/setup.bash
          colcon build \
            --parallel-workers ${COLCON_WORKERS} \
            --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Test
        run: |
          source install/setup.bash
          colcon test --parallel-workers ${COLCON_WORKERS} --event-handlers console_cohesion+
          colcon test-result --verbose
